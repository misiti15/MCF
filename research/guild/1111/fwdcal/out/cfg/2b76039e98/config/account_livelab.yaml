# Live Lab paper account (owner 2026-11-03). MCF_ACCOUNT=livelab overlay on config/default.yaml; orders mll-*, state branch
# mcf-data-livelab, secrets ALPACA_LIVELAB_API_KEY / ALPACA_LIVELAB_SECRET_KEY (market data: the primary SIP keys). The trade,
# watchdog and session-guard jobs skip this account until the owner adds both secrets; the trade job also skips it while
# no setup is enabled here (no idle 6.5-hour session).
#
# The 11-02 Live Lab lane plan (research/bdi/night1102/livelab, top-5 live-first seats) is superseded by the 11-04
# low-rep home plan below; its sizing is kept.
# Sizing (research/bdi/night1102/livelab NOTES "Exact pieces needed"): 200 slots and buying_power_multiple 2.0, so capital
# per slot = equity x 2.0 / 200 = ~$1,000 constant notional per lot at $100k (mcf/backtest/engine.slot_notional, the
# same rule as every account); up to 10 open lots per setup, so 20 seats x 10 never bind on slots.
# max_setup_daily_loss_r: null = the per-setup daily stop is off (as Testing 1/2 since ST-A 2026-10-22); the account
# daily stop is the Testing 120R catastrophe backstop. max_stop_cost_r 0.15 = the Testing cost filter (CF 2026-10-29).
# block_twin_same_symbol false and no live scale-out (livelab PLAN).
#
# strategies_exclusive: only setups listed under `strategies` below run; every setup of config/default.yaml (Primary +
# library) is switched off by the loader (mcf/config.py), including setups added there later. Each setup added here is a
# setup move (promotion = move, assignments regenerated in the same commit, a ledger entry, outside 09:30-16:00 ET).
# LOW-REP HOME (owner 2026-11-04, ledger 2026-11-04-lowrep-explore1-livelab, research/ops/lowrep1104/NOTES.md): Explore 1
# and Live Lab both hold setups with low or no live trade history (< 20 live trades in all accounts from Testing 1/2,
# < 10 from the Graveyard) so they get reps; first session 2026-11-05; re-evaluated every ~2 sessions. Their setups show
# on the leaderboard with an account tag; the account totals stay out of the daily post. This supersedes the earlier
# plans for this account (EX30 ground-up generation / Live Lab top-5 lane). Paper account. Educational only - not
# financial advice.

[project]
name = "mcf"
version = "0.1.0"
description = "MCF: intraday setup research, backtesting, paper trading and performance tracking"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pyarrow>=15",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
alpaca = ["alpaca-py>=0.40"]
dev = ["pytest>=8"]

[project.scripts]
mcf = "mcf.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mcf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

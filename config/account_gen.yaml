# Setup Generator account (owner 2026-10-19). MCF_ACCOUNT=gen overlay on config/default.yaml; orders mcg-*, state branch
# mcf-data-gen, secrets ALPACA_GEN_API_KEY / ALPACA_GEN_SECRET_KEY (market data: the primary SIP keys).
#
# READ THIS FIRST: every setup here is MACHINE-GENERATED by the BDI Setup Generator (mcf/research/generator) and
# quick-screened on the open two-year history with costs in (never the locked block 2024-11..2025-02). They are NOT
# tested edges: no locked holdout, no gates. The owner set NO promotion rules for GEN setups (2026-10-19); this
# account exists to collect live data on new ideas. Each setup's `gen.screen` block holds its screen stats as found,
# negative ones included. Paper account. Educational only - not financial advice.
#
# strategies_exclusive: only the GEN-* setups below run; every setup of config/default.yaml (primary + library) is
# switched off by the loader (mcf/config.py), including setups added there later. Testing 1/2 setups never load here.
# 80 slots: capital per slot = equity x buying_power_multiple / slots (mcf/backtest/engine.slot_notional), the same
# rule as every account, so each slot is an equal increment (~$4,750 at $100k x 3.8 / 80).
# This file is maintained by `python -m mcf.research.generator run --apply` (setup_order rebuilt each run:
# narrowest = fewest screened trades/day first). Hand edits to entries are kept; comments below this header are not.
strategies_exclusive: true
account: {starting_equity: 100000, slots: 80, buying_power_multiple: 3.8, max_concurrent_positions: 80, max_positions_per_strategy: 16,
  max_daily_loss_r: 60, max_trades_per_day: 1000}
live:
  lab_refire: false
  setup_order: []
strategies: {}

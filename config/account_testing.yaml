# Testing-account config (MCF_ACCOUNT=testing overlay on config/default.yaml). Full-day versions LIVE from 2026-10-12
# (merged after the 2026-10-09 close, ledger 2026-10-09-owner-testing-fullday). Source: research/bdi/fullday.
# Owner decision 2026-10-09: "for any of our setups, I want full day versions first, then we can identify time frames
# that may be better." Testing account only; the primary account keeps its tested windows. Every lab/heat setup that
# runs in either account gets a -FD copy (research/bdi/fullday/<NAME>-FD.py) with only the time-of-day clause removed;
# decision bars 09:50-15:00 via window [950, 1500]. The windowed originals are OFF here so the -FD versions get the
# trades (one position per symbol across setups). Time of day is tracked per trade in the EOD/scorecard.
# Verification: research/bdi/fullday/verify.json. Expected trades/day = research/bdi/timeofday/results.csv 'full' rows
# (open two-year lab history, first qualifying bar per symbol-day; L3: computed in verify.json). Lab history only -
# most of these setups are negative after costs over the full day (see the 'exp' notes); this is a forward test.
# Educational only - not financial advice.
account:
  slots: 400
  buying_power_multiple: 3.8
  max_concurrent_positions: 400
  max_positions_per_strategy: 150
  max_daily_loss_r: 120          # owner 2026-10-19 evening: catastrophe backstop only (was 60)
  max_setup_daily_loss_r: 2.0    # owner 2026-10-19 evening: a setup stops for the day at net -2R realized
  max_trades_per_day: 3000
live:
  # Owner 2026-10-13 (research/bdi/longs1013 Q3 Mf + Ma; off in config/default.yaml / Primary).
  retry_after_release: true
  longs_first_on_ties: true
  # Owner 2026-10-14 (research/bdi/bdi1013/NOTES.md G7, Testing 1 only): skip new shorts while QQQ fo - IWM fo >= 0.50%.
  split_tape_short_gate:
    enabled: true
    spread_pct: 0.50
  # Priority when several setups fire on one symbol in the same poll: narrowest (fewest expected trades/day, 
  # research/bdi/timeofday/results.csv) first, so subsets are not starved by supersets (swarm W4, 2026-10-10).
  setup_order:
    - IDX1-qqq100-0955-TQQQ-trail
    - IDX1-qqq100-0955-TQQQ-hold
    - IDX2-spy075-0945-3x-trail
    - IDX3-spy075-0955-3x-trail
    - IDX5-spy050-0945-3x-trail
    - LIQ-pdl-sweep-open15-vwap-long   # 0.38/day (research/bdi/reddit1012liq, added 2026-10-12)
    - ST5-pdbrkup-short-mid-t05s1-FD
    - ST8-volspikedn-long-pm-t1s1-FD
    - ST6-volspikeup-short-mid-t1s1-FD
    - ST3-rsi5up-short-pm-t1s1-FD
    - ST7-rsi50dn-long-pm-t1s1-FD
    - ST4-emadn-long-am-t1s05-FD
    - ST1-ordn-long-pm-t05s1-FD
    - NS4-pm-vwap-reclaim-oversold-short-FD

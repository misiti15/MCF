# Graveyard account (owner decision 2026-10-20, effective session 2026-10-21; RESEARCH_RULES rule 20).
# MCF_ACCOUNT=graveyard overlay on config/default.yaml; orders mgy-*, state branch mcf-data-graveyard, secrets
# ALPACA_GRAVEYARD_API_KEY / ALPACA_GRAVEYARD_SECRET_KEY (market data: the primary SIP keys). Paper account.
#
# READ THIS FIRST: the Graveyard is a separate paper account where the lowest performers of Testing 1 / Testing 2 keep
# paper-trading with LOWER caps. Nothing is deleted: every setup here keeps its full block (and its former_primary
# marker, if it had one) and keeps collecting live data. Retiring a setup completely stays the owner's decision
# (rule 20); routines may only propose it. Testing 2 stays Testing 2.
#
# strategies_exclusive: only the setups below run; every setup of config/default.yaml (primary + library) is switched
# off by the loader (mcf/config.py), including setups added there later. Testing 1/2 and gen setups never load here.
# Promotion = move (owner 2026-10-20): each setup below is switched off in the account it came from.
# Caps (owner 2026-10-20): half of Testing 2's slots / positions, same risk per trade (default.yaml 0.25%), per-setup
# 2R daily stop, 120R account backstop, twin cap on, no live scale-out, no split copies.
# Selection (2026-10-21 move): the listed setups whose COMBINED live win rate (Primary + Testing 1 + Testing 2 report
# CSVs, identical signals de-duplicated) is <= 50%; those above 50% stayed (docs/DECISIONS.md, ledger
# 2026-10-21-graveyard-moves). Educational only - not financial advice.
strategies_exclusive: true
account:
  starting_equity: 100000
  close_adopted_at_open: "2026-11-17"   # KILL-FLAT open (owner 2026-11-16): adopted lots (no journal lot) closed at 09:30 that day only
  slots: 300                      # owner 2026-11-11 after close; from session 2026-11-12 REPV-11 (was 200): smaller lots, more slots
  buying_power_multiple: 1.6      # owner 2026-11-11 after close; from session 2026-11-12 REPV-11 (was 3.8): capital per slot = equity x 1.6 / 300 (~$500 at $94k)
  max_concurrent_positions: 300   # owner 2026-11-11 after close; from session 2026-11-12 REPV-11 (was 200)
  max_positions_per_strategy: 75  # owner 2026-11-11 after close; from session 2026-11-12 REPV-12 (was 25)
  max_daily_loss_r: 120           # catastrophe backstop only (as Testing 1/2)
  max_setup_daily_loss_r: 2.0     # a setup stops for the day at net -2R realized (kept: ST-A 2026-10-22 covered Testing 1/2 + Gen only)
  max_trades_per_day: 1500        # Testing 2: 3000
# GY foot race (owner FOOTRACE 2026-11-19, effective 2026-11-20): "GY should also have a similar footrace mentality ... the
# top 10-20 of setups who are best performing, they can get the majority of the exposure while lower performing setups
# can be on a rotation." The nightly job (research/reps2/nightly.py step 5 = python -m mcf.report.footrace) ranks the
# Graveyard's setups by the shrunk live score (total R and avg R, both w/o best day) and writes the next 3 sessions'
# plan to `file`. The trade run applies it once before the open (mcf/execution/session.py): the top 15 LEADERS play every
# session and come first in setup_order; low-rep (< 10 live trades), rare and new setups always play; the rest rotate by
# WHOLE sessions (logged in the snapshot's rotation.footrace, excluded from per-session stats; owner playing-time rule,
# never an in-session throttle) up to ~85% of the slots, never benched more than 2 sessions in a row (>= 1 in 3).
# Missing / stale file (no entry for the session) -> every enabled setup plays, as before.

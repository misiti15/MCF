# Graveyard account (owner decision 2026-10-20, effective session 2026-10-21; RESEARCH_RULES rule 20).
# MCF_ACCOUNT=graveyard overlay on config/default.yaml; orders mgy-*, state branch mcf-data-graveyard, secrets
# ALPACA_GRAVEYARD_API_KEY / ALPACA_GRAVEYARD_SECRET_KEY (market data: the primary SIP keys). Paper account.
#
# READ THIS FIRST: the Graveyard is a separate paper account where the lowest performers of Testing 1 / Testing 2 keep
# paper-trading with LOWER caps. Nothing is deleted: every setup here keeps its full block (and its former_primary
# marker, if it had one) and keeps collecting live data. Retiring a setup completely stays the owner's decision
# (rule 20); routines may only propose it. Testing 2 stays Testing 2.
#
# strategies_exclusive: only the setups below run; every setup of config/default.yaml (primary + library) is switched
# off by the loader (mcf/config.py), including setups added there later. Testing 1/2 and gen setups never load here.
# Promotion = move (owner 2026-10-20): each setup below is switched off in the account it came from.
# Caps (owner 2026-10-20): half of Testing 2's slots / positions, same risk per trade (default.yaml 0.25%), per-setup
# 2R daily stop, 120R account backstop, twin cap on, no live scale-out, no split copies.
# Selection (2026-10-21 move): the listed setups whose COMBINED live win rate (Primary + Testing 1 + Testing 2 report
# CSVs, identical signals de-duplicated) is <= 50%; those above 50% stayed (docs/DECISIONS.md, ledger
# 2026-10-21-graveyard-moves). Educational only - not financial advice.
strategies_exclusive: true
account:
  starting_equity: 100000
  slots: 200                      # Testing 2: 400
  buying_power_multiple: 3.8      # as Testing 1/2 (capital per slot = equity x 3.8 / 200)
  max_concurrent_positions: 200   # Testing 2: 400
  max_positions_per_strategy: 25  # Testing 2: 50
  max_daily_loss_r: 120           # catastrophe backstop only (as Testing 1/2)
  max_setup_daily_loss_r: 2.0     # a setup stops for the day at net -2R realized (as Testing 1/2)
  max_trades_per_day: 1500        # Testing 2: 3000
live:
  block_twin_same_symbol: true    # no second lot on a symbol already held (or pending) by this setup's twin
  scale_out_max_per_day: 0        # no live scale-out here (no setup sets live_scale_out either)
  # Same flags these setups ran with in Testing 1 / Testing 2 (owner 2026-10-13, research/bdi/longs1013 Q3).
  retry_after_release: true
  longs_first_on_ties: true
  # One position per symbol across setups: narrowest (fewest expected trades/day) first.
  setup_order:
    - ST1-ordn-long-pm-t05s1-FD             # ~3.81/day full-day
    - RW6-ns2-up3-short-FD                  # ~8.48/day
    - NS2-sma50break-overbought-short-FD    # ~19.13/day
    - NS2-sma50break-overbought-short       # former primary (windowed 09:50-11:30)
    - MF1-945-flowsell-vwapup-FD            # ~24.74/day
    - ST2-slope20up-long-am-t05s1-FD        # ~25.72/day
    - heat_fade_long                        # former primary (windowed 11:05-13:30)
    - LIQ-orl-sweep-open15-s25-long         # ~31.3/day
    - RW2-exhaustion-noon-adv150-short-FD   # ~52.08/day
    - heat_fade_long-FD                     # ~55.18/day
    - CWT14-failbrk-orl-p10-lowvol-long     # ~74.36/day (moved from Testing 2 2026-10-21)
    - CWT14-failbrk-orl-p10-long            # ~93.87/day (moved from Testing 2 2026-10-21)
    - heat_fade_short                       # former primary (windowed 09:50-10:30)
    - CWT14-failbrk-orl-p05-lowvol-long     # ~173.74/day (moved from Testing 2 2026-10-21)

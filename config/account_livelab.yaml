  min_shares: 3                  # TSZ1: a lot under 3 shares is raised to 3 if 3 fit in min_shares_notional_pct of equity (= the old slot) and the risk budget
  min_shares_notional_pct: 1.0   # TSZ1: = old slot $ (equity x 2.0 / 200)

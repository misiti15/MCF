# Testing 2 account config (MCF_ACCOUNT=testing2 overlay on config/default.yaml; orders mt2-*, state branch
# mcf-data-testing2, secrets ALPACA_TESTING2_API_KEY / ALPACA_TESTING2_SECRET_KEY). Owner 2026-10-12: a second "minor
# leagues" paper account (the existing Testing account is shown as "Testing 1") that runs "the best 30 setups found from
# the CWT research, even if they are different variants of others".
#
# READ THIS FIRST: NONE of these setups passed the research gates. Every CWT configuration failed (packages A, B, C:
# research/bdi/cwt/test_*/NOTES.md); most are NEGATIVE after costs on the open two-year history. This is an
# owner-directed forward test to collect live data, not a promotion. Selection rule, the full ranking and the count of
# configurations considered: research/bdi/cwt/live/NOTES.md. Parity of every module with its scored version (trade for
# trade on the open history): research/bdi/cwt/live/verify.json.
#
# All primary and Testing-1 setups are OFF here, so Testing 2 trades only its own batch. Each setup is a LabStrategy
# module in research/bdi/cwt/live/ (entry at the close of the first qualifying 5-minute bar in its window, R = 0.25 x
# daily ATR, fixed t1s1/t05s1/t1s05 exit, flat 15:55); min_adv 95M = the scored universe (adv20 >= $95M).
# Comments per setup: source configuration, open-history n / exp (R after costs) / trades per day.
# Educational only - not financial advice.
account:
  slots: 400
  buying_power_multiple: 3.8
  max_concurrent_positions: 400
  # Playing time: a per-setup cap well below the slot count, so the busy setups (up to ~150 signals/day) cannot fill
  # the account and every setup gets entries (Testing 1 uses 150 with fewer busy setups).
  max_positions_per_strategy: 25
  max_daily_loss_r: 60
  max_trades_per_day: 3000
live:
  # One position per symbol across setups: narrowest (fewest open-history trades/day) first, so subsets are not
  # starved by supersets (swarm W4, 2026-10-10).
  setup_order:
    - CWT04-backside-lh-a25-short   # 0.36/day
    - CWT04-backside-vwaptest-a25-short   # 0.56/day
    - CWT05-flush-m075-v5-long   # 1.37/day
    - CWT04-backside-lh-a15-short   # 2.85/day
    - CWT05-flush-m05-v5-long   # 2.93/day
    - CWT05-flush-m075-v3-long   # 3.31/day
    - CWT12-flag-s1-long   # 3.37/day
    - CWT04-backside-vwaptest-a15-short   # 4.76/day
    - CWT13-vwapstretch-z075-short   # 6.14/day
    - CWT05-flush-m05-v3-long   # 8.94/day
    - CWT13-vwapstretch-z075-long   # 9.23/day
    - CWT13-vwapstretch-z05-short   # 37.95/day
    - CWT12-coil-k6-long   # 39.28/day
    - CWT13-vwapstretch-z05-long   # 42.57/day
    - CWT14-failbrk-pdh-p10-lowvol-short   # 45.73/day
    - CWT14-failbrk-orl-p10-lowvol-long   # 74.36/day
    - CWT14-failbrk-pdl-p10-long   # 88.03/day
    - CWT12-coil-k4-long   # 104.47/day
    - CWT14-failbrk-pdl-p05-long   # 156.98/day

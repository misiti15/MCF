# account's OWN keys once the repo variable MCF_DEF_OWN_DATA_KEYS is 'true' (trade / watchdog / eod map ALPACA_API_KEY /
# ALPACA_SECRET_KEY to them for Testing D / E / F only); off until these accounts have the SIP plan (11-11: 403 on SIP). The trade, watchdog and session-guard jobs skip this account until
# both secrets are set; the trade job's "Setup check" also skips it while no setup is enabled here (no idle session).

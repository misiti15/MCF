# MCF default configuration. Copy to config/local.yaml to override (local.yaml is merged on top).

account:
  starting_equity: 100000        # paper account size used for sizing in backtests
  slots: 100                     # owner decision 2026-10-05: 100 concurrent slots
  buying_power_multiple: 2.0     # capital per slot = equity x this / slots (= $2,000 at $100k)
  risk_per_trade_pct: 0.25       # max % of equity lost if the stop is hit (sizing = min(risk, slot))
  max_position_notional_pct: 10  # hard cap on any single position
  max_concurrent_positions: 100
  max_positions_per_strategy: 60  # per-setup sleeve so one setup can't use every slot
  max_daily_loss_r: 20           # risk control (not a signal filter): stop new entries after -20R in a day
  max_trades_per_day: 400

gates:
  # A setup goes live (paper -> funds) only when ALL hold out of sample, after costs (owner decision 2026-10-05)
  min_win_rate: 0.55
  min_expectancy_r: 0.0         # strictly above
  min_trades: 200
  min_profit_factor: 1.2

exits:
  # Scale-out: bank part of the position at +scale_out_r R, move the rest to breakeven.
  # Raises win rate without capping runners. Applied to every setup unless a setup overrides it.
  scale_out_r: 1.0
  scale_out_frac: 0.5

shorts:
  enabled: true                  # owner decision: both directions
  require_easy_to_borrow: true   # live: only short names the broker flags shortable + ETB

costs:
  slippage_bps: 1.0              # per side, against us (limit/target exits excluded)
  slippage_per_share: 0.01       # per side, against us — published ORB edges die at ~2c/share
  stop_slippage_per_share: 0.02  # extra adverse fill on stop exits
  commission_per_share: 0.0      # Alpaca equities are commission-free
  min_price: 5.0                 # ignore sub-$5 names by default (spreads/halts)

session:
  timezone: America/New_York
  open: "09:30"
  close: "16:00"
  flatten_by: "15:55"            # all intraday positions closed by this time

universe:
  min_avg_dollar_volume: 20000000   # 20d average daily $ volume
  min_atr: 0.50                     # daily ATR(14) in dollars
  stocks_in_play_top_n: 20          # per-day top-N by opening relative volume (ORB-style selection)

strategies:
  # Each entry maps to a class in mcf/strategies. enabled=false keeps it out of runs.
  orb:
    enabled: true
    range_minutes: 5
    stop_atr_frac: 0.10
    target_r: null                # null = hold to flatten time (as in the published ORB study)
    min_rvol: 1.0
  vwap_reclaim:
    enabled: false               # experimental
    earliest: "10:00"
    latest: "14:30"
    lookback_bars: 15
    min_rvol: 1.5
    target_r: 2.0
  gap_and_go:
    enabled: false               # experimental: vendor-only evidence
    min_gap_pct: 4.0
    range_minutes: 5
    min_rvol: 2.0
    target_r: 2.0
    exit_by: "11:30"
  gap_fade:
    enabled: false               # experimental
    min_gap_pct: 1.0
    max_gap_pct: 3.0
    range_minutes: 15
    max_rvol: 1.5
    exit_by: "12:00"
  intraday_momentum:
    enabled: true
    symbols: [SPY, QQQ, IWM, DIA]
    signal_time: "10:00"
    entry_time: "15:30"
    min_abs_return_pct: 0.25
    stop_atr_frac: 0.25
  noise_band_momentum:
    enabled: true
    symbols: [SPY, QQQ]
    band_mult: 1.0
    first_check: "10:00"
    last_check: "15:30"
  vwap_reversion:
    enabled: false               # experimental: weak evidence, negative skew (see docs/RESEARCH.md)
    band_std: 2.5
    earliest: "10:00"
    latest: "15:00"
    max_rvol: 3.0
    stop_std: 1.0

report:
  email_to: misiti15@gmail.com   # daily brief recipient
  dashboard_url: https://claude.ai/artifact/LxSZBti7GjRxzKncf4Q1ow   # private Claude artifact (free)

data:
  cache_dir: data/cache
  journal_path: data/journal.db
  feed: iex                      # iex (free) | sip (paid, full tape)

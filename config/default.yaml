# MCF default configuration. Copy to config/local.yaml to override (local.yaml is merged on top).

account:
  starting_equity: 100000        # paper account size used for sizing in backtests
  slots: 160                     # owner 2026-10-06: testing days must not sit out for lack of slots
  buying_power_multiple: 3.2     # capital per slot = equity x 3.2 / 160 (~$1,930, same size as before);
                                 # 160 slots use ~$309k, inside Alpaca paper's ~$321k intraday buying power
  risk_per_trade_pct: 0.25       # max % of equity lost if the stop is hit (sizing = min(risk, slot))
  max_position_notional_pct: 10  # hard cap on any single position
  max_concurrent_positions: 160
  max_positions_per_strategy: 100 # per-setup sleeve so one setup can't use every slot
  max_daily_loss_r: 20           # risk control (not a signal filter): stop new entries after -20R in a day
  max_trades_per_day: 1000

gates:
  # A setup goes live (paper -> funds) only when ALL hold out of sample, after costs.
  # Owner decision 2026-10-05 (rev 2): 65%. Success = +1R reached before -1R (signal quality, checked first);
  # win rate = trade closed green after exit management (checked second); expectancy must stay > 0.
  min_success_rate: 0.65
  min_win_rate: 0.65
  min_expectancy_r: 0.0         # strictly above
  min_trades: 200
  min_profit_factor: 1.2
  # Sustainability (owner 2026-10-05: win rate must come with *sustainable* profit):
  min_months: 6                  # out-of-sample span long enough to see more than one regime
  min_positive_month_rate: 0.67  # net-positive R in at least 2 of every 3 months

exits:
  # Scale-out: bank part of the position at +scale_out_r R, move the rest to breakeven.
  # Raises win rate without capping runners. Applied to every setup unless a setup overrides it.
  scale_out_r: 1.0
  scale_out_frac: 0.5

shorts:
  enabled: true                  # owner decision: both directions
  require_easy_to_borrow: true   # live: only short names the broker flags shortable + ETB

costs:
  slippage_bps: 1.0              # per side, against us (limit/target exits excluded)
  slippage_per_share: 0.01       # per side, against us — published ORB edges die at ~2c/share
  stop_slippage_per_share: 0.02  # extra adverse fill on stop exits
  extended_slippage_per_share: 0.03  # extended-tier names: wider spreads, so 3x the core assumption
  commission_per_share: 0.0      # Alpaca equities are commission-free
  min_price: 5.0                 # ignore sub-$5 names by default (spreads/halts)

session:
  timezone: America/New_York
  open: "09:30"
  close: "16:00"
  flatten_by: "15:55"            # all intraday positions closed by this time

universe:
  # Owner 2026-10-05: no fixed count — include every name with tradeable liquidity and movement.
  max_symbols: null                  # no cap; the filters below define the universe
  min_avg_dollar_volume: 5000000     # core tier: 20d avg daily $ volume, consolidated (SIP) — not IEX
  extended_min_avg_dollar_volume: 1000000  # extended tier: scanned, traded only when in play
  extended_min_rvol: 3.0             # extended tier needs opening rvol >= 3x (its volume then ~= core)
  min_atr_pct: 1.0                   # daily ATR(14) >= 1% of price; drops bond/T-bill ETFs
  stocks_in_play_top_n: 20          # per-day top-N by opening relative volume (ORB-style selection)
  earnings_blackout_days: 4         # owner 2026-10-07: no trades within 4 trading days of earnings (either side)
  # 2026-10-16: no publicly traded partnerships. Selling a PTP (short sales too) makes the broker withhold
  # 10% of gross proceeds (IRS 1446(f)): T2 lost -$374.72 (10-14) and -$178.63 (10-15) on ET/EPD this way.
  # Primary rule: Alpaca asset attributes contain "ptp_*". The denylist applies only when attributes are
  # unavailable. Commodity pools (USO, UNG, ...) are left off it: T1 sold UNG short on 10-12 with no withholding.
  exclude_ptp: true
  ptp_denylist: [ET, EPD, MPLX, PAA, WES, CQP, USAC, SUN, CAPL, BSM, DKL, GEL, NRP, KRP, DMLP, SPH, NGL, GLP,
                 ENLC, NS, HEP]   # last three were acquired (kept so stale data cannot slip them in)


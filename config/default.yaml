# MCF default configuration. Copy to config/local.yaml to override (local.yaml is merged on top).

account:
  starting_equity: 100000        # paper account size used for sizing in backtests
  slots: 160                     # owner 2026-10-06: testing days must not sit out for lack of slots
  buying_power_multiple: 3.2     # capital per slot = equity x 3.2 / 160 (~$1,930, same size as before);
                                 # 160 slots use ~$309k, inside Alpaca paper's ~$321k intraday buying power
  risk_per_trade_pct: 0.25       # max % of equity lost if the stop is hit (sizing = min(risk, slot))
  max_position_notional_pct: 10  # hard cap on any single position
  max_concurrent_positions: 160
  max_positions_per_strategy: 100 # per-setup sleeve so one setup can't use every slot
  max_daily_loss_r: 20           # risk control (not a signal filter): stop new entries after -20R in a day
  max_trades_per_day: 1000

gates:
  # A setup goes live (paper -> funds) only when ALL hold out of sample, after costs.
  # Owner decision 2026-10-05 (rev 2): 65%. Success = +1R reached before -1R (signal quality, checked first);
  # win rate = trade closed green after exit management (checked second); expectancy must stay > 0.
  min_success_rate: 0.65
  min_win_rate: 0.65
  min_expectancy_r: 0.0         # strictly above
  min_trades: 200
  min_profit_factor: 1.2
  # Sustainability (owner 2026-10-05: win rate must come with *sustainable* profit):
  min_months: 6                  # out-of-sample span long enough to see more than one regime
  min_positive_month_rate: 0.67  # net-positive R in at least 2 of every 3 months

exits:
  # Scale-out: bank part of the position at +scale_out_r R, move the rest to breakeven.
  # Raises win rate without capping runners. Applied to every setup unless a setup overrides it.
  scale_out_r: 1.0
  scale_out_frac: 0.5

shorts:
  enabled: true                  # owner decision: both directions
  require_easy_to_borrow: true   # live: only short names the broker flags shortable + ETB

costs:
  slippage_bps: 1.0              # per side, against us (limit/target exits excluded)
  slippage_per_share: 0.01       # per side, against us — published ORB edges die at ~2c/share
  stop_slippage_per_share: 0.02  # extra adverse fill on stop exits
  extended_slippage_per_share: 0.03  # extended-tier names: wider spreads, so 3x the core assumption
  commission_per_share: 0.0      # Alpaca equities are commission-free
  min_price: 5.0                 # ignore sub-$5 names by default (spreads/halts)

session:
  timezone: America/New_York
  open: "09:30"
  close: "16:00"
  flatten_by: "15:55"            # all intraday positions closed by this time

universe:
  # Owner 2026-10-05: no fixed count — include every name with tradeable liquidity and movement.
  max_symbols: null                  # no cap; the filters below define the universe
  min_avg_dollar_volume: 5000000     # core tier: 20d avg daily $ volume, consolidated (SIP) — not IEX
  extended_min_avg_dollar_volume: 1000000  # extended tier: scanned, traded only when in play
  extended_min_rvol: 3.0             # extended tier needs opening rvol >= 3x (its volume then ~= core)
  min_atr_pct: 1.0                   # daily ATR(14) >= 1% of price; drops bond/T-bill ETFs
  stocks_in_play_top_n: 20          # per-day top-N by opening relative volume (ORB-style selection)
  earnings_blackout_days: 4         # owner 2026-10-07: no trades within 4 trading days of earnings (either side)

strategies:
  # Each entry maps to a class in mcf/strategies. enabled=false keeps it out of runs.
  orb:
    enabled: false   # screen 2026-10-06: -0.33R/trade over 63 sessions (pre-09:50 entries -0.59R); paper off
    min_atr: 0.50                 # daily ATR(14) in dollars (published ORB study filter)
    range_minutes: 5
    stop_atr_frac: 0.10
    target_r: null                # null = hold to flatten time (as in the published ORB study)
    min_rvol: 1.0
  vwap_reclaim:
    enabled: false               # experimental
    earliest: "10:00"
    latest: "14:30"
    lookback_bars: 15
    min_rvol: 1.5
    target_r: 2.0
  gap_and_go:
    enabled: false               # experimental: vendor-only evidence
    min_gap_pct: 4.0
    range_minutes: 5
    min_rvol: 2.0
    target_r: 2.0
    exit_by: "11:30"
  gap_fade:
    enabled: false               # experimental
    min_gap_pct: 1.0
    max_gap_pct: 3.0
    range_minutes: 15
    max_rvol: 1.5
    exit_by: "12:00"
  intraday_momentum:
    enabled: true   # screen 2026-10-06: +0.013R/trade, break-even; paper on for data (index ETFs, cheap)
    symbols: [SPY, QQQ, IWM, DIA]
    signal_time: "10:00"
    entry_time: "15:30"
    min_abs_return_pct: 0.25
    stop_atr_frac: 0.25
  noise_band_momentum:
    enabled: false   # screen 2026-10-06: -0.49R/trade (simplified version, not the paper's full rules); paper off
    symbols: [SPY, QQQ]
    band_mult: 1.0
    first_check: "10:00"
    last_check: "15:30"
  vwap_reversion:
    enabled: false               # experimental: weak evidence, negative skew (see docs/RESEARCH.md)
    band_std: 2.5
    earliest: "10:00"
    latest: "15:00"
    max_rvol: 3.0
    stop_std: 1.0

  # ---- 2026-10-06 research sweep (research/setups_research.json). Paper-trade only after the screening
  # backtest (research/setup_screen.md); funds only via the promotion gates. Exits as specced (no scale-out).
  orb20_a:
    enabled: true   # screen 2026-10-06: PASSED (+0.021R, PF 1.11, 443 trades); thin edge, paper only
    class: orb20
    variant: A                   # stop 0.5 x range, target 0.75 x range (higher win rate)
    min_rvol: 1.5
    top_n: 20
    entry_until: "11:30"
    scale_out_r: null
  orb20_b:
    enabled: false
    class: orb20
    variant: B                   # stop 0.15 ATR, no target, hold to close (paper-style)
    stop_atr: 0.15
    min_rvol: 1.5
    top_n: 20
    entry_until: "11:30"
    scale_out_r: null
  gap_continuation:
    enabled: false
    min_gap_pct: 3.0
    min_rvol: 3.0
    target_r: 2.0
    entry_until: "11:00"
    scale_out_r: null
  gap_sma20:
    enabled: false
    mirror: true                 # also test the long mirror (gap up through SMA20)
    stop_atr: 0.05
    scale_out_r: null
  index_gap_fill:
    enabled: false
    symbols: [SPY, QQQ, IWM]
    stop_gap_mult: 1.5
    scale_out_r: null
  close_momentum:
    enabled: false
    symbols: [SPY, QQQ, IWM]
    gate_mult: 0.5
    stop_atr: 0.5
    scale_out_r: null
  eod_reversal:
    enabled: false
    min_drop_pct: 2.0
    min_adv: 20000000
    scale_out_r: null
  vwap_pullback:
    enabled: false
    min_rvol: 2.0
    top_n: 20
    entry_until: "12:00"
    scale_out_r: null

  # ---- Heat-score study 2026-10-06 (research/heat/HEAT_STUDY.md): MarcoFlow's heat re-weighted as a
  # consistent mean-reversion score; positive on train, valid AND the locked test. Paper only.
  heat_fade_short:
    enabled: true
    type: heat
    formula: research/heat/candidates/regime_9.py
    sides: short
    min_adv: 125000000           # the study's population: top ~1,000 names by ADV
    window: [950, 1030]
    gate: fo-
    scale_out_r: null
  heat_fade_long:
    enabled: true
    type: heat
    formula: research/heat/candidates/regime_5.py
    sides: long
    min_adv: 125000000
    window: [1105, 1330]
    gate: gap+
    scale_out_r: null
  # ---- Layered-setup swarm 2026-10-06 (research/setups2/SWARM.md): ~855,600 configurations, 9 finalists,
  # one survived the locked test. Paper only.
  exhaustion_short:
    enabled: true
    type: lab
    module: research/setups2/candidates/volume_flip_1.py   # RSI5 > 90, > 1% above 5-min SMA20, bearish RSI divergence, 13:00-15:00
    min_adv: 95000000            # the study's population: ~1,200 most liquid names
    window: [1300, 1500]
    prefilter: new_high_100m
    scale_out_r: null

  # ---- Owner-directed 2026-10-08 (PROBATION, primary account): MarcoFlow's top rule stacks re-scored in the MCF lab
  # (research/primitives/marcoflow). Train/valid only; NOT scored on the locked holdouts; at production cost most are
  # negative on train. Added at the owner's explicit request despite RESEARCH_RULES; ledger 2026-10-08-owner-mf5.
  MF1-945-flowsell-vwapup:
    enabled: true
    type: lab
    module: research/primitives/marcoflow/MF-945-flowsell-vwapup.py
    min_adv: 95000000
    window: [950, 1030]
    scale_out_r: null
  MF2-open-rsimidhi-flowsell:
    enabled: true
    type: lab
    module: research/primitives/marcoflow/MF-open-rsimidhi-flowsell.py
    min_adv: 95000000
    window: [950, 1100]
    scale_out_r: null
  MF3-open-flowsell-rsi5hi:
    enabled: true
    type: lab
    module: research/primitives/marcoflow/MF-open-flowsell-rsi5hi.py
    min_adv: 95000000
    window: [950, 1100]
    scale_out_r: null
  MF4-h40-open-flowsell:
    enabled: true
    type: lab
    module: research/primitives/marcoflow/MF-h40-open-flowsell.py
    min_adv: 95000000
    window: [950, 1100]
    scale_out_r: null
  MF5-flowsell-vwapup-rsi5hi:
    enabled: true
    type: lab
    module: research/primitives/marcoflow/MF-flowsell-vwapup-rsi5hi.py
    min_adv: 95000000
    window: [950, 1500]
    scale_out_r: null

  # ---- Owner-directed 2026-10-08 (PROBATION, primary account): 5 new setups from the "obvious metrics before big
  # moves" scan (research/owner1008: 7,374 configs, 33 positive on train+valid). Scored once on the locked holdouts
  # for information (research/owner1008/holdouts.json): none clears the t >= 1.0 bar on both. Ledger 2026-10-08-owner-ns5.
  NS1-rsidip-rsi5pop-long:
    enabled: true
    type: lab
    module: research/owner1008/NS1-rsidip-rsi5pop-long.py
    min_adv: 95000000
    window: [950, 1130]
    scale_out_r: null
  NS2-sma50break-overbought-short:
    enabled: true
    type: lab
    module: research/owner1008/NS2-sma50break-overbought-short.py
    min_adv: 95000000
    window: [950, 1130]
    scale_out_r: null
  NS3-failed-vwap-reclaim-short:
    enabled: true
    type: lab
    module: research/owner1008/NS3-failed-vwap-reclaim-short.py
    min_adv: 95000000
    window: [950, 1130]
    scale_out_r: null
  NS4-pm-vwap-reclaim-oversold-short:
    enabled: true
    type: lab
    module: research/owner1008/NS4-pm-vwap-reclaim-oversold-short.py
    min_adv: 95000000
    window: [1130, 1500]
    scale_out_r: null
  NS5-sma50-flush-oversold-long:
    enabled: true
    type: lab
    module: research/owner1008/NS5-sma50-flush-oversold-long.py
    min_adv: 95000000
    window: [950, 1130]
    scale_out_r: null

  # ---- Owner-directed 2026-10-09 (PROBATION, primary account): RW6 + the owner's VWAP band guard (G1k2), the
  # nearest miss of the trend-guard study (research/bdi/trendguard). Two-year history: n 424, +0.26R after costs, t 2.39
  # (required 4.76), positive in up and down sessions. Not scored on the locked block. Ledger 2026-10-09-owner-rw6g1.
  RW6G1-ns2-up3-vwap2sd-short:
    enabled: true
    type: lab
    module: research/bdi/live1009/RW6G1-ns2-up3-vwap2sd-short.py
    min_adv: 95000000
    window: [950, 1130]
    scale_out_r: null

discovery:
  # Weekly layered-rule mining (mcf/discovery.py). Output = candidates; nothing trades automatically.
  # Promote a replicated candidate by adding it under `strategies:` with type: rule, e.g.
  #   rule_hot_short:
  #     enabled: true
  #     type: rule
  #     side: short
  #     layers: ["RSI14 > 65", "below 20 SMA"]
  max_symbols: 1500              # top core names by ADV
  sessions: 60                   # ~3 months of 5-minute SIP bars; older 2/3 = find, newest 1/3 = check
  max_layers: 3                  # owner: more layers = more precise, "to a certain point"
  min_train: 150                 # first-trigger samples needed in the find period
  min_test: 60                   # and in the check period
  r_atr_frac: 0.25               # R = 0.25 x daily ATR
  report_top: 40

report:
  email_to: misiti15@gmail.com   # daily brief recipient
  scorecard_sessions: 4          # owner 2026-10-09: a setup's testing phase is 4 sessions before a removal decision
  dashboard_url: https://claude.ai/artifact/LxSZBti7GjRxzKncf4Q1ow   # private Claude artifact (free)

data:
  cache_dir: data/cache
  journal_path: data/journal.db
  feed: sip                      # owner subscribed to Algo Trader Plus (SIP) 2026-10-05

live:
  # Priority when several setups fire on one symbol in the same poll: narrowest (fewest expected trades/day, 
  # research/bdi/timeofday/results.csv) first, so subsets are not starved by supersets (swarm W4, 2026-10-10).
  setup_order:
    - intraday_momentum
    - orb20_a
    - RW6G1-ns2-up3-vwap2sd-short
    - NS1-rsidip-rsi5pop-long
    - MF2-open-rsimidhi-flowsell
    - NS5-sma50-flush-oversold-long
    - NS4-pm-vwap-reclaim-oversold-short
    - NS3-failed-vwap-reclaim-short
    - MF1-945-flowsell-vwapup
    - NS2-sma50break-overbought-short
    - MF4-h40-open-flowsell
    - MF3-open-flowsell-rsi5hi
    - exhaustion_short
    - MF5-flowsell-vwapup-rsi5hi
    - heat_fade_short
    - heat_fade_long
  # Paper fills anything the price touches. These checks keep paper results close to what a real
  # order book would give, so paper P/L is evidence and not an upper bound.
  no_entry_before: "09:50"       # owner: 9:30-9:50 is too fast for a polling system. Signals there are
                                 # journaled as "shadow" and what-if simulated, so the window is measured.
  max_spread_bps: 30             # live SIP quote at decision time
  max_spread_risk_frac: 0.25     # spread must be <= 25% of the stop distance (else the spread eats R)
  max_participation: 0.10        # order <= 10% of the symbol's average 1-minute volume (last 5 bars)
  status_every_min: 2            # dashboard refresh cadence
  start_from: "08:00"            # CI jobs starting earlier (ET) exit at once
  max_job_minutes: 340           # each CI job hands over after this (GitHub's job limit is 6h)
  fetch_batch: 400

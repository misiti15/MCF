discovery:
  # Weekly layered-rule mining (mcf/discovery.py). Output = candidates; nothing trades automatically.
  # Promote a replicated candidate by adding it under `strategies:` with type: rule, e.g.
  #   rule_hot_short:
  #     enabled: true
  #     type: rule
  #     side: short
  #     layers: ["RSI14 > 65", "below 20 SMA"]
  max_symbols: 1500              # top core names by ADV
  sessions: 60                   # ~3 months of 5-minute SIP bars; older 2/3 = find, newest 1/3 = check
  max_layers: 3                  # owner: more layers = more precise, "to a certain point"
  min_train: 150                 # first-trigger samples needed in the find period
  min_test: 60                   # and in the check period
  r_atr_frac: 0.25               # R = 0.25 x daily ATR
  report_top: 40

report:
  email_to: misiti15@gmail.com   # daily brief recipient
  email_enabled: false           # owner 2026-10-27: hold off on all notification emails (reports still built + saved)
  scorecard_sessions: 4          # owner 2026-10-09: a setup's testing phase is 4 sessions before a removal decision
  dashboard_url: https://claude.ai/artifact/LxSZBti7GjRxzKncf4Q1ow   # private Claude artifact (free)

data:
  cache_dir: data/cache
  journal_path: data/journal.db
  feed: sip                      # owner subscribed to Algo Trader Plus (SIP) 2026-10-05

live:
  # Priority when several setups fire on one symbol in the same poll: narrowest (fewest expected trades/day, 
  # research/bdi/timeofday/results.csv) first, so subsets are not starved by supersets (swarm W4, 2026-10-10).
  setup_order:
    - RW5-heat30-flowsell-rsi5pop-gapdn-short-FD   # promoted 2026-10-15
    - RW3-gapdn-rsi5pop-flowsell-short-FD   # promoted 2026-10-15
    - MF2-open-rsimidhi-flowsell-FD   # promoted 2026-10-20
    - MF4-h40-open-flowsell-FD   # promoted 2026-10-20
    - ST7-rsi50dn-long-pm-t1s1-FD   # promoted 2026-10-25 (~2.4/day: narrow, so early)
    - intraday_momentum
    - orb20_a
    - NS1-rsidip-rsi5pop-long
    - MF2-open-rsimidhi-flowsell
    - NS5-sma50-flush-oversold-long
    - NS4-pm-vwap-reclaim-oversold-short
    - NS3-failed-vwap-reclaim-short
    - NS2-sma50break-overbought-short
    - MF4-h40-open-flowsell
    - MF3-open-flowsell-rsi5hi
    - exhaustion_short
    - MF5-flowsell-vwapup-rsi5hi
    - heat_fade_short
    - heat_fade_long
    - CWT14-failbrk-pdl-p10-lowvol-long   # promoted 2026-10-21 (~47/day: broadest, so last)
  # Paper fills anything the price touches. These checks keep paper results close to what a real
  # order book would give, so paper P/L is evidence and not an upper bound.
  no_entry_before: "09:50"       # owner: 9:30-9:50 is too fast for a polling system. Signals there are
                                 # journaled as "shadow" and what-if simulated, so the window is measured.
  max_spread_bps: 30             # live SIP quote at decision time
  max_spread_risk_frac: 0.25     # spread must be <= 25% of the stop distance (else the spread eats R)
  max_participation: 0.10        # order <= 10% of the symbol's average 1-minute volume (last 5 bars)
  # Pre-entry cross-check (owner 2026-10-16, outage plan step 3): skip a new entry ("crosscheck: ..." in the journal)
  # when the signal's reference price is more than max_dev_pct from the live SIP quote mid, the quote is older than
  # max_age_s, or the decision bar is older than max_bar_age_min. Set above everything seen in normal operation
  # (journal 10-06..10-16, 3,380 submitted entries: max |ref - mid| 1.73%, decision bar <= 3.6 min old). 0 disables.
  quote_crosscheck_max_dev_pct: 2.0
  quote_crosscheck_max_age_s: 300
  quote_crosscheck_max_bar_age_min: 10
  # Outage escalation (owner 2026-10-16, steps 4-5; docs/OPERATIONS.md "Outage plan"). Minutes of CONTINUOUS stale data
  # (health.data_stale): enter_pause_min = no new entries (= data_stale_min); protect_min = stops of open lots in profit
  # (broker's last price) move to breakeven; flatten_min = flatten every MCF position (also after flatten_min with the
  # broker API unreachable). Actions in health.outage_actions; no emails. watchdog_dead_min: the independent watchdog
  # (.github/workflows/watchdog.yml) treats status.json older than this during the session as a dead trading run.
  outage:
    enabled: true
    enter_pause_min: 5
    protect_min: 15
    flatten_min: 30
    watchdog_dead_min: 15
  status_every_min: 2            # dashboard refresh cadence
  log_poll_inputs: true          # owner 2026-10-21: each poll's inputs (latest bar / bar count per symbol, exceptions
                                 # only; poll wall time; stale flag) -> state polls/<date>/<HHMMSS>.jsonl.gz chunks
  poll_log_flush_min: 10         # a new chunk every 10 min and at handover/close (each chunk written + pushed once)
  start_from: "08:00"            # CI jobs starting earlier (ET) exit at once
  max_job_minutes: 340           # each CI job hands over after this (GitHub's job limit is 6h)
  fetch_batch: 400
  # Testing-account flags (owner 2026-10-13, research/bdi/longs1013 Q3): OFF here, so Primary is unchanged.
  # retry_after_release: a market entry skipped "already in symbol" may take its setup's next fresh signal on that
  # symbol (latest bar) after the holding position closes, once per setup/symbol/day (journal info retry_after_release).
  # longs_first_on_ties: setups firing on one symbol in the same poll are tried longs first, then by setup_order.
  retry_after_release: false
  longs_first_on_ties: false
  # Per-lot stacking (owner 2026-10-13): a lot = one setup's own bracket order on a symbol. 1 = one MCF position per
  # symbol (a second setup is skipped "already in symbol"). N > 1: up to N setups may each hold a lot on the same symbol,
  # SAME side only ("opposite side held" / "lot cap" otherwise); every lot keeps its own stop/target legs, trade
  # management and journal row; slots and max positions count lots. A setup stacks on itself only on a new
  # signal (same_setup_reentry below).
  max_lots_per_symbol: 3   # per-lot stacking, all accounts (owner 2026-10-13); 1 = one position per symbol
  # Owner 2026-10-16 (option B, paper): a lot left with < 25% of its original quantity after a partial target fill no
  # longer counts toward max_lots_per_symbol (it still counts for opposite-side, slots and per-setup caps). 0 = off.
  # REVIEW BEFORE REAL FUNDS (docs/DECISIONS.md).
  lot_cap_ignore_residual_frac: 0.25
  # Same-setup re-entry (owner 2026-10-14): "the same setup can not be used at the exact same moment in the exact same
  # ticker, but can be used in the same ticker the same day at a different time - if a setup is great, let it ride."
  # true: a setup may enter a symbol again on a NEW signal (a later decision bar than its previous entry there), as a
  # new lot - also while its earlier lot is open (same side only, under max_lots_per_symbol and every other risk check).
  # Client ids carry the decision-bar time (<prefix><setup>-<symbol>-<YYYYMMDD>-<HHMM>), one per lot.
  # false: one entry per setup/symbol/day (pre-2026-10-14 behaviour, ids without -HHMM).
  same_setup_reentry: true
  # Split-tape short gate (owner 2026-10-14; research/bdi/bdi1013/NOTES.md Part B, G7 "div0.50"): skip NEW short entries
  # while QQQ's return from today's open minus IWM's return from today's open is >= spread_pct percentage points, on the
  # latest completed 1-minute bars at decision time. Longs and open positions unaffected. Skips are journaled
  # "split-tape short gate" with {qqq_ret, iwm_ret, spread} (what-if simulated). Missing/stale QQQ or IWM bars never
  # block (health warning). OFF here (Primary, Testing 2); on in config/account_testing.yaml (Testing 1 forward test).
  split_tape_short_gate:
    enabled: false
    spread_pct: 0.50

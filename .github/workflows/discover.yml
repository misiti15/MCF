# Weekly setup discovery (layered rules) + strategy-backlog re-test on all collected data.
# Candidates only — nothing trades automatically; passing ideas are proposed, then merged after hours with a ledger entry.
# Educational only — not financial advice.
name: discover

on:
  schedule:
    - cron: "17 14 * * 6"    # Saturdays ~10:17 ET
  workflow_dispatch:

concurrency:
  group: mcf-discover
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_DATA_FEED: sip
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -e ".[alpaca]"
      - name: Check out state branch (mcf-data)
        run: git clone -q --depth 20 --branch mcf-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
      - name: Mine
        run: |
          uni=state/universe.csv; [ -f "$uni" ] || uni=data/universe.csv
          python -m mcf.cli discover --universe "$uni" --out state/discovery
      - name: Research bar cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: lab-cache-${{ github.run_id }}
          restore-keys: lab-cache-
      - name: Refresh bars to the last session
        run: python scripts/refresh_lab_data.py
      # Lab entries are re-tested on the 1-minute cache refreshed above (2026-06-15 on; the rule-19 locked block is never
      # read). Exits non-zero when runnable entries exist but none was scored: the step shows as failed in the job
      # summary (continue-on-error), and publishing still runs.
      - name: Re-test the strategy backlog (lab modules on the 1-minute cache; holdouts stay locked)
        id: backlog
        continue-on-error: true
        timeout-minutes: 60
        run: |
          wc -l < research/backlog_results.jsonl > /tmp/results_before 2>/dev/null || echo 0 > /tmp/results_before
          python -m mcf.research.backlog run --workers 4
      - name: Stage backlog results
        run: |
          if [ "${{ steps.backlog.outcome }}" != "success" ]; then
            echo "::error title=Backlog re-test failed::python -m mcf.research.backlog run ended '${{ steps.backlog.outcome }}' - see the step log"
            printf '### Backlog re-test FAILED (%s)\nSee the "Re-test the strategy backlog" step log; results below may be stale.\n' "${{ steps.backlog.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          mkdir -p state/backlog
          # Keep every week's rows: append this run's new result lines to a history file on the state branch.
          n0=$(cat /tmp/results_before 2>/dev/null || echo 0)
          [ -f research/backlog_results.jsonl ] && tail -n +$((n0 + 1)) research/backlog_results.jsonl >> state/backlog/backlog_results_history.jsonl
          for f in research/backlog.jsonl research/backlog_results.jsonl research/BACKLOG.md; do
            [ -f "$f" ] && cp "$f" state/backlog/ || echo "::warning::$f missing"
          done
      - name: Publish
        run: |
          cd state && git add discovery backlog
          git -c user.name=mcf-bot -c user.email=mcf-bot@users.noreply.github.com commit -q -m "discovery + backlog $(date +%F)" && git push -q origin HEAD || echo "nothing to publish"

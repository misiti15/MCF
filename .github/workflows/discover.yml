# Weekly setup discovery (layered rules) + strategy-backlog re-test on all collected data.
# Candidates only — nothing trades automatically; passing ideas are proposed, then merged after hours with a ledger entry.
# Educational only — not financial advice.
name: discover

on:
  schedule:
    - cron: "17 14 * * 6"    # Saturdays ~10:17 ET
  workflow_dispatch:

concurrency:
  group: mcf-discover
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      ALPACA_DATA_FEED: sip
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -e ".[alpaca]"
      - name: Check out state branch (mcf-data)
        run: git clone -q --depth 20 --branch mcf-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" state
      - name: Mine
        run: |
          uni=state/universe.csv; [ -f "$uni" ] || uni=data/universe.csv
          python -m mcf.cli discover --universe "$uni" --out state/discovery
      - name: Research bar cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: lab-cache-${{ github.run_id }}
          restore-keys: lab-cache-
      - name: Refresh bars to the last session
        run: python scripts/refresh_lab_data.py
      - name: Re-test the strategy backlog (train / valid / forward; holdouts stay locked)
        run: |
          python -m mcf.research.backlog run || echo "backlog run failed"
          mkdir -p state/backlog && cp research/backlog.jsonl research/backlog_results.jsonl research/BACKLOG.md state/backlog/ 2>/dev/null || true
      - name: Publish
        run: |
          cd state && git add discovery backlog
          git -c user.name=mcf-bot -c user.email=mcf-bot@users.noreply.github.com commit -q -m "discovery + backlog $(date +%F)" && git push -q origin HEAD || echo "nothing to publish"

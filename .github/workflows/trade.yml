# MCF live paper session on Alpaca (SIP data). Educational only — not financial advice.
#
# Schedules run from the default branch only. Cron is UTC and GitHub may start runs late, so:
#   * pre-open runs at ~08:35/08:55 ET leave time for prep (universe + priors, ~15 min) before 09:30
#   * hourly standby runs keep one job queued behind the running one (same concurrency group), so a
#     crash, a skipped trigger or the 6-hour job limit costs minutes, not the session
#   * GitHub cron can stop for hours (11-05: no scheduled run 09:40-14:50 ET), so each job also dispatches its own
#     successor 15 min before its 355-min limit when none is queued (mcf/execution/handover.py; actions: write)
#   * every run decides from the ET clock whether to work (mcf live exits at once outside 08:00-15:50 ET,
#     on weekends and on market holidays); duplicate UTC lines cover both EDT and EST
#
# Required repository secrets: ALPACA_API_KEY, ALPACA_SECRET_KEY (primary paper account; also the SIP market-data keys).
# Optional: ALPACA_TESTING_API_KEY, ALPACA_TESTING_SECRET_KEY - the "Testing" paper account (owner 2026-10-07). When set, a
# second job per run trades config/account_testing.yaml on that account (orders mct-*, state branch mcf-data-testing).
# Optional: ALPACA_TESTING2_API_KEY, ALPACA_TESTING2_SECRET_KEY - the "Testing 2" paper account (owner 2026-10-12). When set,
# a third job trades config/account_testing2.yaml (orders mt2-*, state branch mcf-data-testing2); skipped while unset.
# Optional: ALPACA_GEN_API_KEY, ALPACA_GEN_SECRET_KEY - the "Setup Generator" paper account (owner 2026-10-19). When set, a
# fourth job trades config/account_gen.yaml (GEN-* setups from mcf/research/generator; orders mcg-*, state branch
# mcf-data-gen); skipped while unset.
# Optional: ALPACA_GRAVEYARD_API_KEY, ALPACA_GRAVEYARD_SECRET_KEY - the "Graveyard" paper account (owner 2026-10-20). When
# set, a fifth job trades config/account_graveyard.yaml (lowest performers, lower caps; orders mgy-*, state branch
# mcf-data-graveyard); skipped while unset.
# Optional (owner 2026-11-03): three more paper accounts, each skipped until BOTH its secrets are set, and skipped while no
# setup is enabled in its config (the "Setup check" step), so an empty account costs ~1 runner minute, not a session:
#   ALPACA_LIVELAB_API_KEY, ALPACA_LIVELAB_SECRET_KEY   - "Live Lab" (config/account_livelab.yaml; orders mll-*, state branch mcf-data-livelab)
#   ALPACA_EXPLORE1_API_KEY, ALPACA_EXPLORE1_SECRET_KEY - "Explore 1" (config/account_explore1.yaml; orders mx1-*, state branch mcf-data-explore1)
# Optional (owner 2026-11-11): Testing D / E / F, same skip rules (both secrets set + at least one enabled setup):
#   ALPACA_TESTINGD_API_KEY, ALPACA_TESTINGD_SECRET_KEY - "Testing D" (config/account_testingd.yaml; orders mtd-*, state branch mcf-data-testingd)
#   ALPACA_TESTINGE_API_KEY, ALPACA_TESTINGE_SECRET_KEY - "Testing E" (config/account_testinge.yaml; orders mte-*, state branch mcf-data-testinge)
#   ALPACA_TESTINGF_API_KEY, ALPACA_TESTINGF_SECRET_KEY - "Testing F" (config/account_testingf.yaml; orders mtf-*, state branch mcf-data-testingf)
# Market data comes from the primary SIP keys above (ALPACA_API_KEY / ALPACA_SECRET_KEY), shared by every job EXCEPT
# Testing D / E / F when the repo variable MCF_DEF_OWN_DATA_KEYS is 'true': then their jobs map ALPACA_API_KEY /
# ALPACA_SECRET_KEY to their own account keys (owner 2026-11-11), so their data calls do not draw on the shared key's rate
# limit. Set it only once those accounts have the SIP data plan (account-check's SIP probe returns 200). The runner reads
# data keys only from ALPACA_API_KEY / ALPACA_SECRET_KEY.
name: trade

on:
  schedule:
    - cron: "35,55 12,13 * * 1-5"   # 08:35/08:55 ET (EDT: 12:xx UTC, EST: 13:xx UTC)
    - cron: "15 14-20 * * 1-5"      # hourly standby during the session
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Scan and journal signals but place no orders"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # handover (owner 2026-11-05): a job near its 355-min limit dispatches its own successor run

jobs:
  session:
    strategy:
      fail-fast: false
      matrix:
        account: [primary, testing, testing2, gen, graveyard, livelab, explore1, testingd, testinge, testingf]
    concurrency:
      group: ${{ matrix.account == 'primary' && 'mcf-trade' || (matrix.account == 'testing2' && 'mcf-trade-testing2' || (matrix.account == 'gen' && 'mcf-trade-gen' || (matrix.account == 'graveyard' && 'mcf-trade-graveyard' || (matrix.account == 'livelab' && 'mcf-trade-livelab' || (matrix.account == 'explore1' && 'mcf-trade-explore1' || (matrix.account == 'testingd' && 'mcf-trade-testingd' || (matrix.account == 'testinge' && 'mcf-trade-testinge' || (matrix.account == 'testingf' && 'mcf-trade-testingf' || 'mcf-trade-testing')))))))) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MCF_ACCOUNT: ${{ matrix.account }}
      MCF_COID_PREFIX: ${{ matrix.account == 'primary' && 'mcf-' || (matrix.account == 'testing2' && 'mt2-' || (matrix.account == 'gen' && 'mcg-' || (matrix.account == 'graveyard' && 'mgy-' || (matrix.account == 'livelab' && 'mll-' || (matrix.account == 'explore1' && 'mx1-' || (matrix.account == 'testingd' && 'mtd-' || (matrix.account == 'testinge' && 'mte-' || (matrix.account == 'testingf' && 'mtf-' || 'mct-')))))))) }}
      STATE_BRANCH: ${{ matrix.account == 'primary' && 'mcf-data' || (matrix.account == 'testing2' && 'mcf-data-testing2' || (matrix.account == 'gen' && 'mcf-data-gen' || (matrix.account == 'graveyard' && 'mcf-data-graveyard' || (matrix.account == 'livelab' && 'mcf-data-livelab' || (matrix.account == 'explore1' && 'mcf-data-explore1' || (matrix.account == 'testingd' && 'mcf-data-testingd' || (matrix.account == 'testinge' && 'mcf-data-testinge' || (matrix.account == 'testingf' && 'mcf-data-testingf' || 'mcf-data-testing')))))))) }}
      # Market data: Testing D / E / F (owner 2026-11-11) can use their OWN account keys for data, so the shared SIP data key's
      # rate limit is not strained - switched by the repo variable MCF_DEF_OWN_DATA_KEYS ('true' = own keys). It stays unset
      # (shared keys) until those accounts have the SIP data plan: on 2026-11-11 their keys got 403 'subscription does not
      # permit querying recent SIP data' (account-check), and the runner reads SIP (ALPACA_DATA_FEED: sip). Every other
      # account always uses the shared ALPACA_API_KEY / ALPACA_SECRET_KEY.
      ALPACA_API_KEY: ${{ vars.MCF_DEF_OWN_DATA_KEYS == 'true' && (matrix.account == 'testingd' && secrets.ALPACA_TESTINGD_API_KEY || (matrix.account == 'testinge' && secrets.ALPACA_TESTINGE_API_KEY || (matrix.account == 'testingf' && secrets.ALPACA_TESTINGF_API_KEY || secrets.ALPACA_API_KEY))) || secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ vars.MCF_DEF_OWN_DATA_KEYS == 'true' && (matrix.account == 'testingd' && secrets.ALPACA_TESTINGD_SECRET_KEY || (matrix.account == 'testinge' && secrets.ALPACA_TESTINGE_SECRET_KEY || (matrix.account == 'testingf' && secrets.ALPACA_TESTINGF_SECRET_KEY || secrets.ALPACA_SECRET_KEY))) || secrets.ALPACA_SECRET_KEY }}
      ALPACA_TRADE_API_KEY: ${{ matrix.account == 'testing' && secrets.ALPACA_TESTING_API_KEY || (matrix.account == 'testing2' && secrets.ALPACA_TESTING2_API_KEY || (matrix.account == 'gen' && secrets.ALPACA_GEN_API_KEY || (matrix.account == 'graveyard' && secrets.ALPACA_GRAVEYARD_API_KEY || (matrix.account == 'livelab' && secrets.ALPACA_LIVELAB_API_KEY || (matrix.account == 'explore1' && secrets.ALPACA_EXPLORE1_API_KEY || (matrix.account == 'testingd' && secrets.ALPACA_TESTINGD_API_KEY || (matrix.account == 'testinge' && secrets.ALPACA_TESTINGE_API_KEY || (matrix.account == 'testingf' && secrets.ALPACA_TESTINGF_API_KEY || '')))))))) }}
      ALPACA_TRADE_SECRET_KEY: ${{ matrix.account == 'testing' && secrets.ALPACA_TESTING_SECRET_KEY || (matrix.account == 'testing2' && secrets.ALPACA_TESTING2_SECRET_KEY || (matrix.account == 'gen' && secrets.ALPACA_GEN_SECRET_KEY || (matrix.account == 'graveyard' && secrets.ALPACA_GRAVEYARD_SECRET_KEY || (matrix.account == 'livelab' && secrets.ALPACA_LIVELAB_SECRET_KEY || (matrix.account == 'explore1' && secrets.ALPACA_EXPLORE1_SECRET_KEY || (matrix.account == 'testingd' && secrets.ALPACA_TESTINGD_SECRET_KEY || (matrix.account == 'testinge' && secrets.ALPACA_TESTINGE_SECRET_KEY || (matrix.account == 'testingf' && secrets.ALPACA_TESTINGF_SECRET_KEY || '')))))))) }}
      ALPACA_DATA_FEED: sip
      MCF_SMTP_USER: ${{ secrets.MCF_SMTP_USER }}
      MCF_SMTP_PASSWORD: ${{ secrets.MCF_SMTP_PASSWORD }}
      PYTHONUNBUFFERED: "1"
      # capacity1103: on 2026-10-30 the 14:3x standby hand-over hung 10 min in setup-python's pip-cache download on all 5
      # accounts at once (the actions/cache default segment timeout is 10 min) -> 11-14 min without polls. 1 min, then pip
      # installs without the cache (~20 s).
      SEGMENT_DOWNLOAD_TIMEOUT_MINS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Window check
        id: window
        run: |
          now=$(TZ=America/New_York date +%H%M); dow=$(TZ=America/New_York date +%u)
          if { [ "$MCF_ACCOUNT" != "primary" ] && [ -z "$ALPACA_TRADE_API_KEY" ]; } || { { [ "$MCF_ACCOUNT" = "testing2" ] || [ "$MCF_ACCOUNT" = "gen" ] || [ "$MCF_ACCOUNT" = "livelab" ] || [ "$MCF_ACCOUNT" = "explore1" ] || [ "$MCF_ACCOUNT" = "testingd" ] || [ "$MCF_ACCOUNT" = "testinge" ] || [ "$MCF_ACCOUNT" = "testingf" ] || [ "$MCF_ACCOUNT" = "graveyard" ]; } && [ -z "$ALPACA_TRADE_SECRET_KEY" ]; }; then echo "run=false" >> "$GITHUB_OUTPUT"; echo "$MCF_ACCOUNT account keys not set: skipped"
          elif [ "$dow" -le 5 ] && [ "$now" -ge 0800 ] && [ "$now" -lt 1550 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; echo "outside 08:00-15:50 ET weekdays: nothing to do"; fi
          echo "day=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
          echo "MCF_JOB_T0=$(date +%s)" >> "$GITHUB_ENV"   # job start, for the hand-over below

      - name: Check secrets
        if: steps.window.outputs.run == 'true'
        run: |
          if [ -z "$ALPACA_API_KEY" ] || [ -z "$ALPACA_SECRET_KEY" ]; then
            echo "::error::Add ALPACA_API_KEY and ALPACA_SECRET_KEY as repository secrets"; exit 1; fi

      - uses: actions/setup-python@v5
        if: steps.window.outputs.run == 'true'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        if: steps.window.outputs.run == 'true'
        run: pip install -q -e ".[alpaca]"

      - name: Setup check (skip an account with no enabled setup)
        if: steps.window.outputs.run == 'true'
        id: setups
        run: |
          n=$(python -c "from mcf.config import load_config; from mcf.strategies.setups import build_strategies; print(len(build_strategies(load_config())))" | tail -1)   # a config error fails the job (bash -e, pipefail), never a silent skip
          if [ "$n" -gt 0 ]; then echo "run=true" >> "$GITHUB_OUTPUT"; echo "$MCF_ACCOUNT: $n setups enabled"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "$MCF_ACCOUNT: no setup enabled: skipped"; fi

      - name: Check out state branch (mcf-data / mcf-data-testing / ... / mcf-data-<account>)
        if: steps.window.outputs.run == 'true' && steps.setups.outputs.run == 'true'
        run: |
          url="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if git clone -q --depth 50 --branch "$STATE_BRANCH" "$url" state; then :; else
            git init -q state && git -C state checkout -q --orphan "$STATE_BRANCH"
            echo "# MCF live state (journal, status). Written by the trade workflow." > state/README.md
            git -C state add README.md
            git -C state -c user.name=mcf-bot -c user.email=mcf-bot@users.noreply.github.com commit -q -m "init state branch"
            git -C state remote add origin "$url" && git -C state push -q origin "$STATE_BRANCH"
          fi

      - name: Restore today's priors
        if: steps.window.outputs.run == 'true' && steps.setups.outputs.run == 'true'
        id: priors
        uses: actions/cache/restore@v4
        with:
          path: state/cache
          key: priors-${{ steps.window.outputs.day }}

      - name: Pre-market prep (universe + priors)
        if: steps.window.outputs.run == 'true' && steps.setups.outputs.run == 'true' && steps.priors.outputs.cache-hit != 'true'
        run: python -m mcf.cli prep --state-dir state

      - name: Save today's priors
        if: steps.window.outputs.run == 'true' && steps.setups.outputs.run == 'true' && steps.priors.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: state/cache
          key: priors-${{ steps.window.outputs.day }}

      - name: Trade
        if: steps.window.outputs.run == 'true' && steps.setups.outputs.run == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Hand-over (owner 2026-11-05; mcf/execution/handover.py): on 11-05 GitHub fired no scheduled run 09:40-14:50 ET,
          # so no hourly standby was queued when this job hit its 355-min limit. 15 min before the limit (if that falls
          # before 15:50 ET) the background helper dispatches trade.yml unless a successor is already queued for this
          # account; the new job waits in the concurrency group and starts when this one ends. Never fails the job.
          nohup python -m mcf.execution.handover trade --account "$MCF_ACCOUNT" --job-start "$MCF_JOB_T0" \
            --ref "${{ github.event.repository.default_branch }}" --mode "${{ inputs.dry_run && 'dry' || 'act' }}" > handover.log 2>&1 &
          python -m mcf.cli live --state-dir state ${{ inputs.dry_run && '--dry-run' || '' }}

  # HK-EOD-CHAIN (2026-11-09): start EOD from the closing run itself. A trade run dispatched by a bot (session guard /
  # hand-over) does not fire eod.yml's workflow_run chain, and on 11-09 the 16:25 backup cron did not fire either. This job
  # waits for every account job of this run (final flatten + state push done), then, at/after 15:55 ET on a market day,
  # dispatches eod.yml with auto=true (each account still skips when today's report exists) unless another trade run still
  # has a session job active or an EOD run since 15:50 ET is running / done (mcf/execution/handover.py decide_eod).
  # eod.yml keeps its workflow_run trigger and cron as backups. GitHub API + calendar GET only; never fails the run.
  eod-start:
    needs: session
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
      ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
    steps:
      - name: Closing-run check
        id: w
        run: |
          now=$(TZ=America/New_York date +%H%M); dow=$(TZ=America/New_York date +%u)
          if [ "$dow" -le 5 ] && [ "$now" -ge 1555 ] && [ "$now" -lt 2000 ]; then echo "run=true" >> "$GITHUB_OUTPUT"
          else echo "run=false" >> "$GITHUB_OUTPUT"; echo "not after the close ($now ET): EOD not started from this run"; fi
      - uses: actions/checkout@v4
        if: steps.w.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.w.outputs.run == 'true'
        with:
          python-version: "3.11"
      - name: Start EOD
        if: steps.w.outputs.run == 'true'
        run: |
          pip install -q pandas || true
          python -m mcf.execution.handover eod --ref "${{ github.event.repository.default_branch }}" --mode act || true

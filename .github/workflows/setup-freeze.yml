# Owner rule (2026-10-06): setups may only change outside market hours (09:30-16:00 ET, weekdays).
# This check fails a pull request that changes setup definitions, exits, sizing or risk rules while the market is open.
# The live runner also freezes the setups for the day at the first job (state/setups/<date>.json).
name: setup-freeze

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup changes outside market hours only
        # Logic and the list of watched paths / config blocks: mcf/research/setup_freeze.py (tests/test_setup_freeze.py).
        # OPS-FREEZE (inspector 11-27): also config/account_*.yaml, config/longhold.yaml and the default.yaml blocks
        # risk / account / costs / session. OPS-FREEZE2: every config `module:` file, arena_rotation (+ its reps file),
        # mcf/execution/risk.py and mcf/rotation.py. Window unchanged: 09:30-16:00 ET weekdays.
        run: python3 -m mcf.research.setup_freeze --base "${{ github.event.pull_request.base.sha }}"

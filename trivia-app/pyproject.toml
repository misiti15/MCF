[project]
name = "trivia-app"
version = "0.1.0"
description = "Personal niche-topic trivia with daily drops, cited answers and four difficulty levels."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["trivia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
